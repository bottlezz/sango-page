<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sango 手动桌面 UI Mock · V3 玩家卡</title>
<style>
:root{color-scheme:dark;--gold:#e2b84b;--line:#e8cf8b45;--text:#f4ead2;--muted:#9fb6aa;--ink:#291f13;--red:#ff6961}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#061c18}body{min-width:1180px;color:var(--text);font:14px Inter,"Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% 25%,#185745,#061c18 68%)}button{font:inherit}.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;height:54px;padding:0 18px;border-bottom:1px solid var(--line);background:#051210f2}.seal{display:grid;place-items:center;width:32px;height:32px;background:#8f302a;border:1px solid #d76859;font:700 18px Georgia}.brand{font:700 16px Georgia,"STKaiti";letter-spacing:.12em}.room{color:var(--muted);font-size:12px}.mode{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px}.live-dot{width:7px;height:7px;border-radius:50%;background:#71c18f;box-shadow:0 0 0 4px #71c18f1f}.top-btn,.manual-btn,.deck-action,.player-tool{border:1px solid var(--line);border-radius:7px;color:var(--text);background:#ffffff0f;cursor:pointer}.top-btn{padding:7px 10px}
.board-wrap{overflow:auto;padding:12px}.board{position:relative;width:1440px;height:890px;margin:auto;border:1px solid #e2b84b57;border-radius:16px;background:linear-gradient(145deg,#124338eb,#051c18fa);box-shadow:inset 0 0 85px #0005,0 20px 50px #0006}.board:before{content:"SANGO";position:absolute;inset:43% 0 auto;text-align:center;color:#f0cc730b;font:900 84px Georgia;letter-spacing:.2em}
.player-card{--kingdom:#30c56e;position:absolute;display:grid;grid-template-columns:176px minmax(0,1fr);grid-template-rows:40px 47px 112px 46px;gap:7px;width:390px;height:280px;padding:9px;border:2px solid #e2b84bb3;border-radius:13px;background:linear-gradient(145deg,#123f35,#071f1a);box-shadow:0 18px 45px #0006,inset 0 0 0 1px #ffffff0a}.p2{left:10px;top:10px}.p3{left:525px;top:10px}.p4{left:1040px;top:10px}.p5{left:10px;top:300px}.p6{left:1040px;top:300px}.active-turn{border-color:#f4ce75;box-shadow:0 0 0 3px #e2b84b26,0 18px 45px #0007}.active-turn:before{content:"当前回合";position:absolute;top:-10px;left:12px;z-index:5;padding:3px 8px;border-radius:99px;color:#251b0d;background:var(--gold);font-size:10px;font-weight:900}
.generals{grid-area:1/1/4/2;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-bottom:54px}.general{position:relative;overflow:hidden;border:3px solid var(--kingdom);border-radius:8px;background:#061d18;box-shadow:inset 0 0 12px color-mix(in srgb,var(--kingdom) 40%,transparent)}.general.wei{--kingdom:#4a8ed1}.general.shu{--kingdom:#d7433c}.general.qun{--kingdom:#aaa}.general img{width:100%;height:100%;object-fit:cover;object-position:center 18%}.general-name{position:absolute;right:0;bottom:0;left:0;padding:18px 4px 5px;text-align:center;background:linear-gradient(transparent,#000e);font-weight:800;text-shadow:0 1px 3px #000}.general:not(.public):after{content:"将";position:absolute;inset:0;display:grid;place-items:center;color:#352716;background:radial-gradient(circle at 45% 32%,#fff6d36b,transparent 23%),linear-gradient(145deg,#ead09b,#b98b4f);font:900 27px Georgia,"STKaiti";text-shadow:0 1px #fff6;box-shadow:inset 0 0 0 3px #4c32183b,inset 0 0 24px #5b391857}.general:not(.public) .general-name{display:none}
.equipment{position:absolute;left:9px;bottom:55px;z-index:3;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:176px;height:50px}.equip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:2px 1px;border:1px solid #e8cf8b8c;border-radius:5px;color:#2b2113;background:linear-gradient(#fff5d8,#d8bd80);font-size:10px;line-height:1.15}.equip span{display:block;width:100%;overflow:hidden;font-size:9px;font-weight:700;letter-spacing:-.35px;white-space:nowrap;text-align:center}.equip.empty{color:#8aa197;border-style:dashed;background:#ffffff06}
.identity{grid-area:1/2;display:flex;align-items:center;gap:7px;padding:0 8px;border-bottom:1px solid #ffffff12}.seat{color:#9db1a7;font-size:11px}.role{padding:2px 7px;border:1px solid #d2933e;border-radius:99px;color:#ffe0a0;background:#b54c1f38}.role.hidden{color:#c9d2cd;border-color:#c9d2cd59;background:#ffffff0a}.name{font-weight:850}.status{grid-area:2/2;display:flex;align-items:center;padding:0 8px}.hp{display:flex;align-items:center;gap:7px;color:var(--red);font-weight:900}.hp b{font-size:24px}.hp span{min-width:51px;font-size:13px;white-space:nowrap;text-align:center}
.zones{grid-area:3/2;display:grid;gap:6px}.zone-btn{display:grid;grid-template-columns:35px 1fr auto;align-items:center;width:100%;padding:0 9px;border:1px solid var(--line);border-radius:7px;color:var(--text);background:#ffffff0b;cursor:pointer;text-align:left}.zone-btn:hover{border-color:var(--gold);background:#e2b84b24}.zone-btn small{color:var(--muted)}.count{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;color:#f7dd9b;background:#0005;font-weight:900}
.judgment{grid-area:4/1/5/3;display:grid;grid-template-columns:52px repeat(3,minmax(0,1fr));gap:5px;align-items:center;padding-top:3px;border-top:1px solid #ffffff14}.judgment>strong{padding-left:4px;color:var(--muted);font-size:11px}.judge-slot{display:grid;grid-template-columns:20px minmax(0,1fr);align-items:center;gap:3px;height:38px;padding:3px;border:1px dashed #97b1a447;border-radius:6px;font-size:10px;overflow:hidden}.effect-name{display:grid;place-items:center;width:20px;height:27px;border:1px dashed #e8cf8b57;border-radius:4px;color:#f3d28ca6;font:900 12px Georgia}.slot-card{display:flex;align-items:center;min-width:0;height:29px;overflow:hidden;padding:0 3px;color:#8fa69a85;white-space:nowrap;text-overflow:ellipsis}.judge-slot.occupied{border-style:solid;border-color:#e8cf8b38;background:#0002}.judge-slot.occupied .effect-name{color:#20170d;border-style:solid;border-color:#e4c373;background:#e4c373}.judge-slot.occupied .slot-card{border:1px solid #8c713b;border-radius:5px;color:#261d13;background:linear-gradient(145deg,#fff8e5,#d7bf88);font:800 9.5px Georgia}
.public-table{position:absolute;left:410px;top:300px;display:grid;grid-template-columns:76px minmax(0,1fr) 142px;gap:8px;width:620px;height:280px;padding:9px;border:1px solid var(--line);border-radius:13px;background:#041d18d1;box-shadow:0 18px 45px #0005}.table-tools{display:grid;grid-template-rows:auto repeat(5,1fr);gap:5px}.tool-title,.area-title{color:var(--muted);font-size:10px;letter-spacing:.08em}.manual-btn{padding:5px}.manual-btn:hover,.deck-action:hover,.player-tool:hover{border-color:var(--gold);background:#e2b84b24}.manual-btn.danger{color:#eaa59d}.discard{min-width:0;padding:8px;border:1px solid #ffffff14;border-radius:8px;background:#ffffff06}.discard-head{display:flex;justify-content:space-between;gap:8px}.discard-head span:last-child{color:var(--muted);font-size:9px}.played-cards{height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}.mini-card{position:relative;flex:0 0 62px;width:62px;height:96px;margin-left:-12px;padding:5px;border:1px solid #8c713b;border-radius:6px;color:var(--ink);background:linear-gradient(145deg,#fff8e5,#d7bf88);box-shadow:0 3px 7px #0005;cursor:pointer;text-align:left;transition:.14s}.mini-card:first-child{margin-left:0}.mini-card:hover,.mini-card.selected{z-index:4;transform:translateY(-8px)}.mini-card.selected{box-shadow:0 0 0 3px var(--gold),0 7px 14px #0006}.suit{font:800 11px Georgia}.red .suit{color:#bd342d}.card-name{position:absolute;right:3px;bottom:20px;left:3px;text-align:center;font-weight:900}.where{position:absolute;right:3px;bottom:5px;left:3px;color:#735f39;font-size:8px;text-align:center}.deck-area{display:grid;grid-template-rows:auto 1fr auto;gap:6px}.deck-stack{display:grid;grid-template-rows:1fr 1fr;gap:6px}.draw-pile,.dropzone{display:grid;place-items:center;text-align:center;border-radius:7px}.draw-pile{border:1px solid #c97859;background:repeating-linear-gradient(45deg,#743029,#743029 6px,#934138 6px,#934138 12px)}.draw-pile b{display:block;font-size:25px}.draw-pile span,.dropzone{font-size:10px}.dropzone{border:1px dashed var(--line);color:#d7c78f}.deck-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}.deck-action{padding:6px 3px;font-size:10px}
.local-card{left:310px;top:600px;grid-template-columns:176px 160px minmax(0,1fr);grid-template-rows:32px 34px minmax(0,1fr);width:820px}.local-card .generals{grid-area:1/1/4/2}.local-card .general:not(.public):after{display:none}.local-card .general-name{display:block}.local-card .equipment{bottom:9px}.local-card .identity{grid-area:1/2/2/3}.local-card .status{grid-area:1/3/2/4}.state-buttons{position:absolute;top:9px;right:9px;display:grid;grid-template-columns:1fr 1fr;gap:5px}.state-btn{width:43px;height:30px;padding:0;border:1px solid #e8cf8b52;border-radius:7px;color:#e8eee9;background:#ffffff11;font-size:11px;font-weight:800;cursor:pointer}.state-btn.on{color:#192019;border-color:var(--gold);background:var(--gold)}.player-toolbar{grid-area:2/2/3/4;display:flex;align-items:center;gap:6px}.player-tool{min-width:70px;height:30px;padding:0 12px;font-size:11px;font-weight:800}.hp-action{color:#ffb0aa}.expanded-areas{grid-area:3/2/4/4;display:grid;grid-template-rows:80px 28px 28px 34px;gap:4px;min-width:0}.area-line{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px;align-items:center;min-width:0;padding:4px 6px;border:1px solid #e8cf8b2e;border-radius:7px;background:#ffffff06}.area-line>strong{color:#d9c991;font-size:11px}.hand-line{align-items:stretch}.inline-cards{display:flex;align-items:center;min-width:0;overflow:hidden}.inline-cards .mini-card{flex-basis:46px;width:46px;height:70px;margin-left:-11px;padding:4px;font-size:9px}.inline-cards .mini-card:first-child{margin-left:0}.inline-cards .card-name{bottom:5px;font-size:10px}.area-card{display:flex;align-items:center;min-width:88px;height:22px;margin-right:5px;padding:0 7px;border:1px solid #8c713b;border-radius:5px;color:var(--ink);background:linear-gradient(145deg,#fff8e5,#d7bf88);font-size:10px;font-weight:750}.empty-area{color:#9fb6aa94;font-size:11px}.expanded-areas .judgment{display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr));grid-area:auto;padding:0;border:0}.toast{position:fixed;top:65px;left:50%;z-index:60;transform:translate(-50%,-15px);opacity:0;padding:9px 14px;border-radius:8px;color:#231700;background:var(--gold);font-weight:750;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1450px){.board{transform-origin:top left;transform:scale(calc((100vw - 24px)/1440));margin-bottom:calc(-890px + 890px * ((100vw - 24px)/1440))}}
</style></head><body><div class="app"><header class="topbar"><span class="seal">杀</span><span class="brand">SANGO · 六人身份局</span><span class="room">房间 006</span><span class="mode"><i class="live-dot"></i><span>手动桌面 · 技能与结算由玩家执行</span></span><button class="top-btn" id="helpBtn">操作说明</button></header><main class="board-wrap"><section class="board" id="board" aria-label="六人游戏桌面">
<section class="public-table" aria-label="公共牌桌"><aside class="table-tools"><span class="tool-title">牌桌工具</span><button class="manual-btn" data-msg="身份已随机分配；每位玩家只看到自己的身份">身份</button><button class="manual-btn" data-msg="已向六个座位发放武将候选">发将</button><button class="manual-btn" data-msg="弃牌堆已回收并洗牌">洗牌</button><button class="manual-btn" data-msg="已进入手动修正模式">修正</button><button class="manual-btn danger" data-msg="清台需要房主再次确认">清台</button></aside><section class="discard"><div class="discard-head"><span class="area-title">公共区 · 弃牌与结算</span><span>点击选牌</span></div><div class="played-cards"><button class="mini-card red" data-card="闪电"><span class="suit">♥ Q</span><span class="card-name">闪电</span><span class="where">公共区</span></button><button class="mini-card" data-card="过河拆桥"><span class="suit">♣ 4</span><span class="card-name">过河拆桥</span><span class="where">弃牌</span></button><button class="mini-card" data-card="乐不思蜀"><span class="suit">♣ 6</span><span class="card-name">乐不思蜀</span><span class="where">弃牌</span></button><button class="mini-card" data-card="杀"><span class="suit">♣ 4</span><span class="card-name">杀</span><span class="where">弃牌</span></button><button class="mini-card" data-card="酒"><span class="suit">♠ 9</span><span class="card-name">酒</span><span class="where">弃牌</span></button></div></section><aside class="deck-area"><span class="area-title">牌堆</span><div class="deck-stack"><div class="draw-pile"><div><b>84</b><span>剩余牌</span></div></div><div class="dropzone">武将堆<br>剩余 323</div></div><div class="deck-actions"><button class="deck-action" data-msg="已将顶牌摸入你的手牌">摸一张</button><button class="deck-action" data-msg="已展示牌堆顶">亮顶牌</button></div></aside></section>
<article class="player-card local-card active-turn"><div class="generals"><div class="general public"><img src="../imgs/j176.jpg" alt="孙亮"><span class="general-name">孙亮 ♂</span></div><div class="general public"><img src="../imgs/j126.jpg" alt="董昭"><span class="general-name">董昭 ♂</span></div></div><div class="equipment"><div class="equip"><strong>♣2</strong><span>仁王盾</span></div><div class="equip"><strong>♦K</strong><span>骅骝</span></div><div class="equip empty"><strong>＋</strong><span>装备</span></div><div class="equip empty"><strong>＋</strong><span>装备</span></div></div><div class="identity"><span class="seat">p1 · 你</span><span class="role">忠</span><span class="name">greg</span></div><div class="status"><div class="hp"><b>♥</b><span id="hpValue">12 / 15</span></div></div><div class="state-buttons"><button class="state-btn">翻面</button><button class="state-btn">横置</button></div><div class="player-toolbar"><button class="player-tool" data-msg="打开选将面板">选将</button><button class="player-tool hp-action" id="hpUp">加血</button><button class="player-tool hp-action" id="hpDown">扣血</button><button class="player-tool" id="hpLimit">血量</button></div><div class="expanded-areas"><div class="area-line hand-line"><strong>手牌 8</strong><div class="inline-cards" id="hand"></div></div><div class="area-line"><strong>区1</strong><div class="inline-cards"><span class="area-card">♠7 · 南蛮入侵</span><span class="area-card">♥2 · 桃</span></div></div><div class="area-line"><strong>区2</strong><span class="empty-area">暂无卡牌 · 可直接拖入</span></div><div class="judgment"><strong>判定区</strong><div class="judge-slot occupied"><span class="effect-name">乐</span><span class="slot-card">♣J铁索连环</span></div><div class="judge-slot"><span class="effect-name">兵</span><span class="slot-card">空位</span></div><div class="judge-slot"><span class="effect-name">电</span><span class="slot-card">空位</span></div></div></div></article>
</section></main></div><template id="remoteCard"><article class="player-card"><div class="generals"><div class="general"><img alt=""><span class="general-name"></span></div><div class="general"><img alt=""><span class="general-name"></span></div></div><div class="equipment"><div class="equip"><strong>♣2</strong><span>仁王盾</span></div><div class="equip"><strong>♦K</strong><span>骅骝</span></div><div class="equip"><strong>♠Q</strong><span>丈八蛇矛</span></div><div class="equip empty"><strong>＋</strong><span>装备</span></div></div><div class="identity"><span class="seat"></span><span class="role hidden">匿</span><span class="name"></span></div><div class="status"><div class="hp"><b>♥</b><span></span></div></div><div class="zones"><button class="zone-btn" data-zone="手牌"><b>手牌</b><small>背面可选</small><span class="count"></span></button><button class="zone-btn" data-zone="区1"><b>区1</b><small>临时牌区</small><span class="count"></span></button><button class="zone-btn" data-zone="区2"><b>区2</b><small>临时牌区</small><span class="count"></span></button></div><div class="judgment"><strong>判定区</strong><div class="judge-slot"><span class="effect-name">乐</span><span class="slot-card">空位</span></div><div class="judge-slot"><span class="effect-name">兵</span><span class="slot-card">空位</span></div><div class="judge-slot"><span class="effect-name">电</span><span class="slot-card">空位</span></div></div></article></template><div class="toast" id="toast"></div>
<script>
const players=[{seat:'p2',name:'tt',role:'忠',hp:'15 / 15',n:[6,1,0],g:[['shu','j2.jpg','界刘备',1],['wu','j10.jpg','张昭张纮',0]],judge:1},{seat:'p3',name:'sora',role:'匿',hp:'11 / 15',n:[5,0,1],g:[['wei','j3.jpg','界曹操',1],['wei','j101.jpg','副将',0]]},{seat:'p4',name:'lin',role:'匿',hp:'15 / 15',n:[2,0,0],g:[['wu','j4.jpg','界孙权',0],['wu','j104.jpg','副将',0]]},{seat:'p5',name:'north',role:'主',hp:'13 / 15',n:[6,0,0],g:[['shu','j1.jpg','刘备',1],['shu','j105.jpg','副将',1]]},{seat:'p6',name:'mei',role:'匿',hp:'8 / 15',n:[4,0,1],g:[['wu','j341.jpg','界孙鲁班',1],['qun','j106.jpg','副将',0]]}];const board=document.querySelector('#board'),template=document.querySelector('#remoteCard');players.forEach(p=>{const c=template.content.firstElementChild.cloneNode(true);c.classList.add(p.seat);c.querySelector('.seat').textContent=p.seat;c.querySelector('.name').textContent=p.name;c.querySelector('.role').textContent=p.role;c.querySelector('.status span').textContent=p.hp;c.querySelectorAll('.count').forEach((x,i)=>x.textContent=p.n[i]);c.querySelectorAll('.general').forEach((g,i)=>{const d=p.g[i];g.classList.add(d[0]);if(d[3])g.classList.add('public');g.querySelector('img').src='../imgs/'+d[1];g.querySelector('img').alt=d[2];g.querySelector('.general-name').textContent=d[2]});if(p.judge){const s=c.querySelector('.judge-slot');s.classList.add('occupied');s.querySelector('.slot-card').textContent='♣6 乐不思蜀'}board.append(c)});
const hand=[['♣ J','铁索连环',0],['♦ 9','闪',1],['♥ 8','无中生有',1],['♠ K','无懈可击',0],['♥ Q','过河拆桥',1],['♣ 4','兵粮寸断',0],['♦ 7','杀',1],['♥ 3','桃',1]];document.querySelector('#hand').innerHTML=hand.map(x=>`<button class="mini-card ${x[2]?'red':''}" data-card="${x[1]}"><span class="suit">${x[0]}</span><span class="card-name">${x[1]}</span></button>`).join('');const toast=document.querySelector('#toast');let timer;function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1700)}document.querySelectorAll('[data-msg]').forEach(b=>b.addEventListener('click',()=>say(b.dataset.msg)));document.querySelectorAll('.zone-btn').forEach(b=>b.addEventListener('click',()=>say(b.closest('.player-card').querySelector('.name').textContent+' · '+b.dataset.zone)));document.querySelectorAll('.state-btn').forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('on');say(b.textContent+'状态已手动切换')}));const selected=new Set();document.querySelectorAll('.mini-card[data-card]').forEach(c=>c.addEventListener('click',()=>{c.classList.toggle('selected');c.classList.contains('selected')?selected.add(c):selected.delete(c);say(selected.size?'已选择 '+[...selected].map(x=>'【'+x.dataset.card+'】').join('、'):'已取消选择')}));let hp=12,maxHp=15;const render=()=>document.querySelector('#hpValue').textContent=hp+' / '+maxHp;document.querySelector('#hpUp').onclick=()=>{hp=Math.min(maxHp,hp+1);render()};document.querySelector('#hpDown').onclick=()=>{hp=Math.max(0,hp-1);render()};document.querySelector('#hpLimit').onclick=()=>{const n=Number(prompt('选择血量上限（1-15）',maxHp));if(Number.isInteger(n)&&n>0&&n<16){maxHp=n;hp=Math.min(hp,maxHp);render()}};document.querySelector('#helpBtn').onclick=()=>say('所有操作由玩家确认；卡牌与技能效果不自动结算');
</script></body></html>
