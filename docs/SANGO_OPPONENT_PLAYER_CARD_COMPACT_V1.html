<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sango compact opponent player card concept</title>
  <style>
    :root{color-scheme:dark;--gold:#e2b84b;--line:rgba(232,207,139,.27);--text:#f4ead2;--muted:#9fb6aa;--panel:#082b25}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:36px 24px;background:radial-gradient(circle at 50% 22%,#185745,#061c18 68%);color:var(--text);font:14px Inter,"Microsoft YaHei","PingFang SC",sans-serif}button{font:inherit}.page{width:min(1240px,100%);margin:auto}.intro{display:flex;align-items:end;justify-content:space-between;gap:30px}.introLess{display:none}.intro h1{margin:0;color:#f0cc73;font:800 25px Georgia,"STKaiti",serif}.intro p{max-width:610px;margin:0;color:var(--muted);line-height:1.55}.metrics{display:flex;gap:7px;margin:16px 0 20px}.metric{padding:6px 10px;border:1px solid var(--line);border-radius:99px;color:#d8e5dd;background:rgba(0,0,0,.14);font-size:11px}.metric strong{color:#f1d27d}.cards{display:grid;grid-template-columns:repeat(3,390px);gap:18px}.player-card{--kingdom:#30c56e;position:relative;display:grid;grid-template-columns:176px minmax(0,1fr);grid-template-rows:34px 40px minmax(0,1fr);gap:7px;width:390px;height:230px;padding:9px;border:2px solid rgba(226,184,75,.7);border-radius:13px;background:linear-gradient(145deg,#123f35,#071f1a);box-shadow:0 18px 45px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.04)}
    .generals{grid-area:1/1/4/2;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-bottom:54px}.general{position:relative;overflow:hidden;border:3px solid var(--kingdom);border-radius:8px;background:#061d18;box-shadow:inset 0 0 12px color-mix(in srgb,var(--kingdom) 40%,transparent)}.general.wei{--kingdom:#4a8ed1}.general.shu{--kingdom:#d7433c}.general.qun{--kingdom:#aaa}.general img{width:100%;height:100%;object-fit:cover;object-position:center 18%}.general-name{position:absolute;right:0;bottom:0;left:0;padding:18px 4px 5px;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.9));font-size:12px;font-weight:800;text-shadow:0 1px 3px #000}.general:not(.public):after{content:"将";position:absolute;inset:0;display:grid;place-items:center;color:#352716;background:radial-gradient(circle at 45% 32%,rgba(255,246,211,.42),transparent 23%),linear-gradient(145deg,#ead09b,#b98b4f);font:900 27px Georgia,"STKaiti",serif;text-shadow:0 1px rgba(255,255,255,.4);box-shadow:inset 0 0 0 3px rgba(76,50,24,.23),inset 0 0 24px rgba(91,57,24,.34)}.general:not(.public) .general-name{display:none}
    .equipment{position:absolute;left:9px;bottom:9px;z-index:3;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:176px;height:50px}.equip{display:grid;grid-template-columns:13px 1fr;align-items:center;justify-items:center;min-width:0;padding:3px 2px;border:1px solid rgba(232,207,139,.55);border-radius:5px;color:#2b2113;background:linear-gradient(#fff5d8,#d8bd80);line-height:1}.card-index{display:grid;grid-auto-rows:min-content;place-items:center;align-self:start;justify-self:start;gap:1px;font:800 11px/1 Georgia,serif}.card-index i{font-style:normal}.card-name{overflow:hidden;font-size:10px;font-weight:800;line-height:1;letter-spacing:.5px;white-space:nowrap;writing-mode:vertical-rl;text-orientation:upright}.equip.empty{color:#8aa197;border-style:dashed;background:rgba(255,255,255,.025)}.equip.empty .card-index{grid-column:1/-1;align-self:center;justify-self:center}.equip.empty .card-name{display:none}
    .identity{position:absolute;top:8px;left:197px;z-index:6;display:flex;align-items:center;justify-content:flex-start;gap:5px;width:max-content;max-width:82px;height:23px;padding:0;border:0;background:transparent;box-shadow:none}.identity:before{display:none}.identity:after{content:"";position:absolute;bottom:-8px;left:-5px;width:136px;height:1px;background:linear-gradient(90deg,transparent,rgba(232,207,139,.34) 8%,rgba(232,207,139,.34) 92%,transparent)}.seat{flex:none;color:#9db1a7;font-size:10px;text-shadow:0 1px 2px #061c18}.name{min-width:0;overflow:hidden;font-size:11px;font-weight:850;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 1px 2px #061c18}.role{padding:2px 7px;border:1px solid #d2933e;border-radius:99px;color:#ffe0a0;background:rgba(181,76,31,.22);font-size:11px}.role.hidden{color:#c9d2cd;border-color:rgba(201,210,205,.35);background:rgba(255,255,255,.04)}.player-role{position:absolute;top:10px;right:8px;z-index:4;margin:0}.status{position:relative;z-index:4;grid-area:2/2;display:grid;grid-template-rows:18px 18px;align-content:start;gap:6px;width:82px;padding:0 5px}.state-markers{display:grid;grid-template-columns:32px 1px 32px;align-items:center;gap:3px;width:71px;height:18px}.state-markers:before,.state-markers:after{display:none}.state-divider{color:rgba(232,207,139,.38);font-size:11px;line-height:1;text-align:center}.state-marker{position:relative;display:grid;place-items:center;width:32px;height:18px;border:1px dashed rgba(232,207,139,.38);border-radius:4px;color:rgba(243,210,140,.62);background:rgba(7,31,26,.94);box-shadow:inset 0 0 0 1px rgba(255,255,255,.025);font:800 10px "Microsoft YaHei","PingFang SC",sans-serif;white-space:nowrap}.state-marker.active{color:#eafff2;border-color:#68b88f;border-style:solid;background:linear-gradient(145deg,#34765d,#174b3b);box-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 0 0 1px rgba(190,245,213,.16);text-shadow:0 1px 2px #071f1a}.hp{display:flex;align-items:center;gap:4px;height:18px;color:#ff6961;font-weight:900}.hp b{font-size:18px}.hp span{font-size:11px;white-space:nowrap}
    .compact-body{display:contents}.zones{grid-area:3/2;display:grid;grid-template-rows:repeat(3,1fr);gap:5px;width:82px}.zone-btn{display:grid;grid-template-columns:1fr 22px;align-items:center;min-width:0;padding:0 5px;border:1px solid var(--line);border-radius:6px;color:var(--text);background:rgba(255,255,255,.045);cursor:pointer;text-align:left;transition:.14s}.zone-btn:hover,.zone-btn.active{border-color:var(--gold);background:rgba(226,184,75,.15)}.zone-btn b{font-size:11px}.count{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#f7dd9b;background:rgba(0,0,0,.3);font-size:10px;font-weight:900}
    .judgment{grid-area:2/2/4/3;display:grid;grid-template-rows:repeat(3,1fr);gap:6px;min-width:0;margin-left:90px}.judgment>strong{display:none}.judge-slot{position:relative;display:grid;place-items:center;min-width:0;min-height:0;padding:3px 2px;border:1px dashed rgba(151,177,164,.32);border-radius:6px;color:rgba(143,166,154,.55);background:rgba(255,255,255,.025);font-size:9px;cursor:pointer;transition:.14s}.judge-slot:hover{border-color:rgba(226,184,75,.65);background:rgba(226,184,75,.08)}.effect{position:absolute;bottom:-4px;left:-4px;z-index:2;display:grid;place-items:center;width:22px;height:22px;border:1px dashed rgba(232,207,139,.38);border-radius:6px;color:rgba(243,210,140,.62);background:rgba(7,31,26,.94);box-shadow:none;opacity:.58;font:900 12px Georgia,"STKaiti",serif}.judge-slot:hover .effect{opacity:.85}.slot-card{display:grid;grid-template-columns:13px 1fr;align-items:center;justify-items:center;width:100%;height:100%;min-width:0;overflow:hidden;text-align:center}.slot-card .card-index{font-size:11px}.slot-card .card-name{font-size:10px}.judge-slot:not(.occupied) .slot-card{display:grid;grid-template-columns:1fr}.judge-slot:not(.occupied) .card-index{align-self:center;justify-self:center;margin:0}.judge-slot:not(.occupied) .card-name{display:none}.judge-slot.occupied{border-style:solid;border-color:#8c713b;color:#261d13;background:linear-gradient(#fff5d8,#d8bd80);box-shadow:0 2px 5px rgba(0,0,0,.28)}.judge-slot.occupied .effect{color:#fff4c7;background:#8d342b;border-color:#d76859;border-style:solid;box-shadow:0 2px 5px rgba(0,0,0,.35);opacity:1}
    .selection{margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;color:var(--muted);background:rgba(3,23,19,.58)}.selection strong{color:#efd27f}.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.note{padding:11px;border:1px solid rgba(255,255,255,.07);border-radius:8px;background:rgba(255,255,255,.025);color:var(--muted);font-size:12px;line-height:1.45}.note b{display:block;margin-bottom:3px;color:#e8d49c}@media(max-width:1240px){.cards{grid-template-columns:repeat(3,390px);width:max-content}.page{overflow:auto;padding-bottom:8px}}@media(max-width:700px){body{min-width:430px;padding:24px 18px}.intro{display:block}.intro p{margin-top:8px}.metrics{flex-wrap:wrap}.cards{grid-template-columns:390px}.notes{grid-template-columns:1fr}}
    .cards{grid-template-columns:repeat(3,336px);gap:16px}.player-card{width:287px;overflow:visible}.identity:after{width:87px}.status{display:flex;align-items:flex-start}.state-markers{position:absolute;top:8px;left:calc(100% + 7px);z-index:5;display:flex;flex-direction:column;gap:4px;width:42px;height:auto}.state-divider{display:none}.state-marker{display:none;width:42px;height:19px}.state-marker.active{display:grid}.judgment{position:absolute;top:56px;bottom:9px;left:calc(100% + 7px);grid-area:auto;display:flex;flex-direction:column;gap:6px;width:42px;height:auto;margin-left:0}.judge-slot{display:none;flex:0 0 51px;width:42px;height:51px}.judge-slot.occupied{display:grid}.judgment:has(.occupied):before{content:"";position:absolute;top:0;bottom:0;left:-5px;width:1px;background:linear-gradient(transparent,rgba(232,207,139,.38) 8%,rgba(232,207,139,.38) 92%,transparent)}@media(max-width:1080px){.cards{grid-template-columns:repeat(3,336px);width:max-content}}@media(max-width:700px){.cards{grid-template-columns:336px}}
    /* Unrevealed generals share a faction-neutral frame. */
    .general:not(.public){border-color:#8c7b62;box-shadow:none}
.general,.general:not(.public){border:0;box-shadow:none}
.general img{display:block}
.general:not(.public):after{box-shadow:none}
.general .faction-badge{position:absolute;top:6px;left:6px;z-index:2;display:grid;place-items:center;width:23px;height:27px;border-radius:3px 3px 7px 3px;background:var(--badge-color);color:#fff9ed;font:800 15px Georgia,"STKaiti",serif;box-shadow:0 2px 5px #0007;text-shadow:0 1px 2px #0008}
.general.wei{--badge-color:#316da7}
.general.shu{--badge-color:#ac3933}
.general.wu{--badge-color:#267c4b}
.general.qun{--badge-color:#68616f}
.general:not(.public) .faction-badge{display:none}

    .state-marker.active[data-state="翻面"]{color:#f5eaff;border-color:#ae86d2;background:linear-gradient(145deg,#79529a,#4b3066)}
    .state-marker.active[data-state="连环"]{color:#eafff2;border-color:#68b88f;background:linear-gradient(145deg,#34765d,#174b3b)}
    
    /* Keep the divider outside the name's clipping box. */
    .player-card>.role{display:grid;place-items:center;width:20px;height:20px;max-width:20px;padding:0;border-radius:50%;font-size:10px;line-height:1}
    .player-card:not(.local-card) .identity{left:197px;right:33px;width:auto;max-width:none;gap:0;overflow:visible}
    .player-card:not(.local-card) .identity:after{display:block;content:"";position:absolute;left:-5px;bottom:-8px;width:87px;height:1px;background:linear-gradient(90deg,transparent,rgba(232,207,139,.34) 8%,rgba(232,207,139,.34) 92%,transparent)}
    .player-card .identity .name{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  </style>
</head>
<body><main class="page"><header class="intro"><h1>对手玩家卡 · 卡外状态与判定队列</h1><p>点亮的翻面、连环显示在卡外顶部；判定牌按实际放入顺序紧随其后。未点亮状态和空槽完全隐藏。</p></header><div class="metrics"><span class="metric"><strong>卡外顶部</strong> 已点亮状态</span><span class="metric"><strong>FIFO</strong> 判定牌队列</span><span class="metric"><strong>未使用</strong> 完全隐藏</span></div><section class="cards" id="cards"></section><div class="selection" id="selection">点击任意牌区或已存在的判定牌查看交互反馈；卡外队列仅显示当前有效内容。</div><section class="notes"><div class="note"><b>状态位于判定牌上方</b>翻面、连环纵向排列；没有点亮的状态不会占用显示位置。</div><div class="note"><b>判定牌采用 FIFO</b>判定牌按照放入顺序从上到下显示，不再绑定乐、兵、电的固定槽位。</div><div class="note"><b>空队列不留痕迹</b>没有状态或判定牌时，不显示槽位、边框或占位文字。</div></section></main>
<template id="player"><article class="player-card"><div class="generals"><div class="general"><img alt=""><span class="general-name"></span></div><div class="general"><img alt=""><span class="general-name"></span></div></div><div class="equipment"><div class="equip"><strong class="card-index"><i>♣</i><i>2</i></strong><span class="card-name">仁王盾</span></div><div class="equip"><strong class="card-index"><i>♦</i><i>K</i></strong><span class="card-name">骅骝</span></div><div class="equip"><strong class="card-index"><i>♠</i><i>Q</i></strong><span class="card-name">丈八蛇矛</span></div><div class="equip empty"><strong class="card-index"><i>＋</i></strong><span class="card-name">装备</span></div></div><div class="identity"><span class="seat"></span><span class="name"></span></div><span class="role hidden player-role"></span><div class="status"><div class="hp"><b>♥</b><span></span></div></div><div class="state-markers" aria-label="玩家状态"><span class="state-marker" data-state="翻面" title="翻面">翻面</span><span class="state-divider" aria-hidden="true">|</span><span class="state-marker" data-state="连环" title="连环">连环</span></div><div class="compact-body"><div class="zones"><button class="zone-btn" data-zone="手牌"><b>手牌</b><span class="count"></span></button><button class="zone-btn" data-zone="区1"><b>区1</b><span class="count"></span></button><button class="zone-btn" data-zone="区2"><b>区2</b><span class="count"></span></button></div><div class="judgment" aria-label="判定区"><strong>判定区</strong><button class="judge-slot" data-effect="乐不思蜀"><span class="effect">乐</span><span class="slot-card"><strong class="card-index"><i>＋</i></strong><span class="card-name">判定牌</span></span></button><button class="judge-slot" data-effect="兵粮寸断"><span class="effect">兵</span><span class="slot-card"><strong class="card-index"><i>＋</i></strong><span class="card-name">判定牌</span></span></button><button class="judge-slot" data-effect="闪电"><span class="effect">电</span><span class="slot-card"><strong class="card-index"><i>＋</i></strong><span class="card-name">判定牌</span></span></button></div></div></article></template>
<script>
const players=[
  {seat:'p2',name:'tt',role:'忠',hp:'15 / 15',counts:[6,1,0],states:['翻面','连环'],g:[['shu','j2.jpg','界刘备 ♂',1],['wu','j10.jpg','界张昭张纮 ♂',0]],judges:[['闪电','♥Q','闪电'],['乐不思蜀','♣6','乐不思蜀']]},
  {seat:'p3',name:'sora',role:'匿',hp:'11 / 15',counts:[5,0,1],states:['翻面'],g:[['wei','j3.jpg','界曹操 ♂',1],['wu','j101.jpg','孙鲁班 ♀',0]],judges:[['兵粮寸断','♠4','兵粮寸断'],['闪电','♥Q','闪电']]},
  {seat:'p4',name:'lin',role:'匿',hp:'15 / 15',counts:[2,0,0],states:[],g:[['wu','j4.jpg','界孙权 ♂',0],['qun','j104.jpg','沮授 ♂',0]],judges:[]}
],root=document.querySelector('#cards'),template=document.querySelector('#player');
players.forEach(player=>{const card=template.content.firstElementChild.cloneNode(true);card.querySelector('.seat').textContent=player.seat;card.querySelector('.role').textContent=player.role;card.querySelector('.name').textContent=player.name;card.querySelector('.hp span').textContent=player.hp;card.querySelectorAll('.count').forEach((count,index)=>count.textContent=player.counts[index]);card.querySelectorAll('.general').forEach((general,index)=>{const info=player.g[index];general.classList.add(info[0]);if(info[3])general.classList.add('public');general.querySelector('img').src='../imgs/'+info[1];general.querySelector('img').alt=info[2];general.querySelector('.general-name').textContent=info[2]});player.states.forEach(state=>card.querySelector('[data-state="'+state+'"]').classList.add('active'));player.judges.forEach((judge,order)=>{const slot=[...card.querySelectorAll('.judge-slot')].find(item=>item.dataset.effect===judge[0]),face=judge[1];slot.classList.add('occupied');slot.style.order=order;slot.querySelector('.slot-card').innerHTML='<strong class="card-index"><i>'+face.slice(0,1)+'</i><i>'+face.slice(1)+'</i></strong><span class="card-name">'+judge[2]+'</span>'});root.append(card)});
const output=document.querySelector('#selection');document.querySelectorAll('.zone-btn').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.zone-btn').forEach(item=>item.classList.remove('active'));button.classList.add('active');const player=button.closest('.player-card').querySelector('.name').textContent,count=button.querySelector('.count').textContent;output.innerHTML='<strong>'+player+' · '+button.dataset.zone+'</strong>：'+count+' 张牌'}));document.querySelectorAll('.judge-slot').forEach(button=>button.addEventListener('click',()=>{const player=button.closest('.player-card').querySelector('.name').textContent,face=button.querySelector('.slot-card').innerText.replace(/\n/g,' ');output.innerHTML='<strong>'+player+' · '+button.dataset.effect+'</strong>：'+face}));
const factionLabels={wei:'魏',shu:'蜀',wu:'吴',qun:'群'};
document.querySelectorAll('#cards .general').forEach(g=>{const faction=Object.keys(factionLabels).find(key=>g.classList.contains(key));if(!faction)return;const badge=document.createElement('span');badge.className='faction-badge';badge.textContent=factionLabels[faction];badge.setAttribute('aria-label',factionLabels[faction]+'阵营');g.append(badge)});
document.querySelectorAll('#cards .player-card').forEach(card=>{const seat=card.querySelector('.seat');seat.remove();const name=card.querySelector('.name');name.title=name.textContent});
</script></body></html>
