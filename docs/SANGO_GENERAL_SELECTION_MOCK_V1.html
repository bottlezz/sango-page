<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SANGO · 紧凑选将设计 V1</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f4ead2;background:radial-gradient(ellipse at 50% 40%,#184d3c,#061c18 75%);font-family:"Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid #f0cc73;outline-offset:3px}.topbar{height:56px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid #e8cf8b33;background:#071c18}.seal{padding:5px 9px;background:#8f302a;font:700 21px serif}.brand{letter-spacing:2px}.muted{color:#aebeb6;font-size:12px}.topbar .muted{margin-left:auto}.intro{margin:40px auto;max-width:1008px;padding:0 16px}.intro h1{font-size:18px;font-weight:500}.intro p{color:#aebeb6;font-size:13px}.ghost-table{margin:36px auto;border:1px solid #e8cf8b18;border-radius:20px;width:90%;height:55vh;display:grid;place-items:center;color:#e8cf8b16;font:700 64px Georgia;letter-spacing:16px}
dialog{color:#f4ead2;border:1px solid #c4a151;border-radius:14px;background:#091f1a;box-shadow:0 20px 70px #0009;padding:16px;width:min(1008px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto}dialog::backdrop{background:#00100ba6;backdrop-filter:blur(3px)}header{display:flex;align-items:center;gap:14px;margin-bottom:16px}header strong{color:#f0cc73;font-size:18px}header .close{margin-left:auto}.btn{border:1px solid #e8cf8b44;border-radius:6px;background:#ffffff0b;padding:8px 14px;font-size:13px}.primary{background:linear-gradient(#edc55f,#c88a2d);color:#241800;font-weight:700;border-color:#e2b84b}.primary:disabled{background:#ffffff08;border-color:#ffffff16;color:#8f8a79;cursor:default}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;padding:6px 0 4px}.candidate{position:relative;min-width:0}.portrait{position:relative;display:block;padding:0;border:0;border-radius:7px;overflow:hidden;width:100%;height:160px;background:#183b2d;transition:transform .15s,box-shadow .15s}.portrait:hover{transform:translateY(-3px)}.portrait[aria-pressed=true]{transform:translateY(-4px);box-shadow:0 0 0 2px #f0cc73,0 6px 16px #0007}.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 18%}.faction{position:absolute;top:6px;left:6px;background:var(--faction);border-radius:3px 3px 7px 3px;padding:4px 6px;font:700 15px serif}.name{position:absolute;bottom:0;left:0;right:0;padding:22px 2px 8px;background:linear-gradient(transparent,#03110cf2);font-size:14px;font-weight:700}.position{display:none;position:absolute;right:5px;top:6px;background:#ebc466;color:#281e08;border-radius:4px;padding:3px 5px;font-size:11px;font-weight:700}.portrait[aria-pressed=true] .position{display:block}.detail{display:block;margin:8px auto 0;background:none;border:0;color:#aebeb6;font-size:12px;padding:4px 10px}.detail:hover{color:#f0cc73}footer{display:flex;align-items:center;gap:12px;border-top:1px solid #e8cf8b26;margin-top:12px;padding-top:14px}.selection{flex:1;font-size:13px;color:#cfdbd2}.selection b{color:#f0cc73}.status{font-size:12px;color:#cce1ca;min-height:16px;margin:8px 0 0}#details{width:min(480px,90vw)}#skills{line-height:1.8;font-size:14px;white-space:pre-line;color:#d4dfd6}@media(max-width:950px){#picker{width:min(624px,calc(100vw - 24px))}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.portrait{height:140px}header .muted{display:none}footer{flex-wrap:wrap}.selection{flex-basis:100%}}
</style>
<div class="topbar"><span class="seal">杀</span><b class="brand">SANGO · 双将3v3</b><span class="muted">房间 006 · p1</span></div>
<section class="intro"><h1>选择武将 · 紧凑窗口</h1><p>7 名候选，选择 2 名。先选主将，再选副将。</p><button class="btn" id="open">打开选将窗口</button></section>
<div class="ghost-table" aria-hidden="true">SANGO</div>
<dialog id="picker" aria-labelledby="title"><header><strong id="title">选择武将</strong><span class="muted">七选二 · 双将3v3</span><button class="btn close" id="close">关闭</button></header><div class="grid" id="grid"></div><footer><div class="selection" id="selection"></div><button class="btn primary" id="confirm" disabled>锁定武将 0/2</button></footer><p class="status" id="status" role="status"></p></dialog>
<dialog id="details" aria-labelledby="detailTitle"><header><strong id="detailTitle"></strong><button class="btn close" id="detailClose">关闭</button></header><div id="skills"></div></dialog>
<script>
const generals=[{"id":"j1","name":"刘备","force":"蜀","gender":"M","health":"4","skill":"仁德: 出牌阶段, 你可以将任意张手牌交给其他角色, 然后你本阶段以此法给出第二张牌时, 你回复1点体力。/激将：主公技，其他蜀势力角色可以在你需要时代替你使用或打出【杀】（视为由你使用或打出）。"},{"id":"j3","name":"界曹操","force":"魏","gender":"M","health":"4","skill":"奸雄: 当你受到伤害后，你可以摸一张牌，并获得造成此伤害的牌。/护驾：主公技，其他魏势力角色可以在你需要时代替你使用或打出【闪】（然后视为由你使用或打出）。每回合限一次，当其他魏势力角色于其回合外使用或打出【闪】时，其可以令你摸一张牌。"},{"id":"j4","name":"界孙权","force":"吴","gender":"M","health":"4","skill":"制衡: 出牌阶段限一次，你可以弃置任意张牌，然后摸等量张牌，若你以此法弃置了所有手牌，你额外摸一张牌。/救援：主公技，其他吴势力角色于其回合内回复体力时，若其体力值大于等于你，则其可以改为令你回复一点体力，然后其摸一张牌。"},{"id":"j6","name":"曹丕","force":"魏","gender":"M","health":"3","skill":"行殇: 当其他角色死亡时，你可以获得其所有牌。/放逐: 当你受到伤害后, 你可以令一名其他角色翻面, 并令其摸X张牌(X为你已损失体力值)。/颂威：主公技，当其他魏势力角色的黑色判定牌生效后，其可以令你摸一张牌。"},{"id":"j7","name":"黄盖","skill":"苦肉：出牌阶段，你可以失去一点体力，然后摸两张牌。","force":"吴","gender":"M","health":"4"},{"id":"j8","name":"界黄忠","skill":"烈弓：你【杀】的攻击范围为此【杀】点数。当你使用【杀】指定目标后，你可以执行以下效果： 1.若其手牌数不大于你，其不能抵消此【杀】； 2. 若其体力值不小于你，此【杀】伤害值+1。","force":"蜀","gender":"M","health":"4"},{"id":"j9","name":"曹仁","skill":"据守：结束阶段，你可以翻面并摸四张牌，然后弃置一张手牌，若为装备牌，你改为使用之。/解围：你可以将装备区里的牌当【无懈可击】使用。当你从背面翻至正面时，你可以弃置一张牌，然后移动场上一张牌。","force":"魏","gender":"M","health":"4"}];
const picker=document.querySelector('#picker'),grid=document.querySelector('#grid'),confirmButton=document.querySelector('#confirm'),detailDialog=document.querySelector('#details');
let selected=[],locked=false;
const colors={'魏':'#316da7','蜀':'#ac3933','吴':'#267c4b','群':'#68616f'};
generals.forEach(g=>{
 const item=document.createElement('article');item.className='candidate';
 const card=document.createElement('button');card.className='portrait';card.dataset.id=g.id;card.setAttribute('aria-pressed','false');card.setAttribute('aria-label',`选择${g.name}`);card.style.setProperty('--faction',colors[g.force]||colors['群']);
 const image=document.createElement('img');image.src=`../imgs/${g.id}.jpg`;image.alt=g.name;
 const faction=document.createElement('span');faction.className='faction';faction.textContent=g.force;
 const name=document.createElement('span');name.className='name';name.textContent=g.name+' '+(g.gender==='M'?'♂':'♀');
 const position=document.createElement('span');position.className='position';card.append(image,faction,name,position);
 card.onclick=()=>{if(locked)return;const i=selected.indexOf(g.id);if(i>=0)selected.splice(i,1);else if(selected.length<2)selected.push(g.id);else{document.querySelector('#status').textContent='已选两名，请先取消其中一名。';return}render()};
 const detail=document.createElement('button');detail.className='detail';detail.textContent='查看技能';detail.onclick=()=>{document.querySelector('#detailTitle').textContent=g.name;document.querySelector('#skills').textContent=`${g.force} · 体力 ${g.health}\n\n${g.skill.split('/').join('\n\n')}`;detailDialog.showModal()};item.append(card,detail);grid.append(item);
});
function render(){grid.querySelectorAll('.portrait').forEach(card=>{const i=selected.indexOf(card.dataset.id);card.setAttribute('aria-pressed',String(i>=0));card.querySelector('.position').textContent=i===0?'主将':'副将'});document.querySelector('#selection').textContent=['主将','副将'].map((label,i)=>`${label}：${generals.find(g=>g.id===selected[i])?.name||'未选择'}`).join('　 /　 ');confirmButton.disabled=locked||selected.length!==2;confirmButton.textContent=locked?'已锁定':`锁定武将 ${selected.length}/2`;document.querySelector('#status').textContent=locked?'已锁定，可点击“重新选择”继续预览。':''}
document.querySelector('#open').onclick=()=>picker.showModal();document.querySelector('#close').onclick=()=>picker.close();document.querySelector('#detailClose').onclick=()=>detailDialog.close();confirmButton.onclick=()=>{locked=true;render()};render();picker.showModal();
</script>
</html>
